<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyLang Playground — try it in your browser</title>
<meta name="description" content="MyLang: a pseudocode-style programming language. Run it right here in your browser (WebAssembly).">
<meta property="og:type" content="website">
<meta property="og:title" content="MyLang Playground — try it in your browser">
<meta property="og:description" content="A pseudocode-style programming language with a dual backend (interpreter + C++ transpiler). Runs entirely in your browser via WebAssembly — no install needed.">
<meta property="og:url" content="https://vpdrla.github.io/MyLang/">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="MyLang Playground — try it in your browser">
<meta name="twitter:description" content="A pseudocode-style programming language. Runs entirely in your browser via WebAssembly — no install needed.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>▶</text></svg>">
<style>
  :root {
    --bg: #16181d; --panel: #1e2128; --panel2: #22262e;
    --text: #d7dae0; --dim: #8b919c; --accent: #4ea1ff; --accent2: #7ee787;
    --err: #ff7b72; --border: #2c313a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 12px 18px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  header h1 { font-size: 18px; color: var(--accent); font-weight: 700; }
  header .sub { color: var(--dim); font-size: 13px; }
  header a { color: var(--dim); font-size: 13px; text-decoration: none; margin-left: auto; }
  header a:hover { color: var(--accent); }
  .toolbar {
    padding: 10px 18px; display: flex; gap: 10px; align-items: center;
    border-bottom: 1px solid var(--border); flex-wrap: wrap;
  }
  button, select {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    padding: 7px 16px; border-radius: 7px; font-size: 14px; cursor: pointer;
  }
  #runBtn { background: var(--accent); color: #0b0d10; font-weight: 700; padding: 7px 26px; }
  #runBtn:disabled { opacity: .5; cursor: wait; }
  button:hover:not(:disabled), select:hover { border-color: var(--accent); }
  .hint { color: var(--dim); font-size: 12px; }
  main { flex: 1; display: flex; min-height: 0; }
  .pane { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .pane + .pane { border-left: 1px solid var(--border); }
  .pane-title {
    padding: 6px 14px; font-size: 12px; color: var(--dim);
    background: var(--panel); border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
  }
  #editor {
    flex: 1; background: var(--bg); color: var(--text); border: none; resize: none;
    padding: 14px; font-family: "Cascadia Code", Consolas, "D2Coding", monospace;
    font-size: 14px; line-height: 1.55; outline: none; white-space: pre; overflow: auto;
    tab-size: 4;
  }
  #output {
    flex: 1; padding: 14px; overflow: auto; white-space: pre-wrap;
    font-family: "Cascadia Code", Consolas, "D2Coding", monospace;
    font-size: 14px; line-height: 1.55; background: var(--panel);
  }
  #output .err { color: var(--err); }
  #output .ok { color: var(--accent2); }
  #clearBtn { font-size: 11px; padding: 2px 10px; }
  @media (max-width: 760px) {
    main { flex-direction: column; }
    .pane + .pane { border-left: none; border-top: 1px solid var(--border); }
  }
</style>
</head>
<body>

<header>
  <h1>MyLang Playground</h1>
  <span class="sub">runs entirely in your browser (WebAssembly) · 설치 없이 브라우저에서 바로 실행</span>
  <a href="https://github.com/Vpdrla/MyLang" target="_blank">GitHub ↗</a>
</header>

<div class="toolbar">
  <button id="runBtn" disabled>▶ Run (Ctrl+Enter)</button>
  <select id="examples">
    <option value="hello">Hello / 기본</option>
    <option value="fib">Recursion / 재귀 (fib)</option>
    <option value="class">Class / 클래스</option>
    <option value="dict">Dict + try/catch</option>
    <option value="guess">Game: 숫자 맞히기 (input)</option>
    <option value="rpg">Game: 던전 오브 마이랭 (RPG)</option>
  </select>
  <span class="hint">input uses a dialog · import is not available on the web · 파일 저장(writefile)은 새로고침하면 사라져요</span>
</div>

<main>
  <div class="pane">
    <div class="pane-title"><span>code (.my)</span></div>
    <textarea id="editor" spellcheck="false"></textarea>
  </div>
  <div class="pane">
    <div class="pane-title">
      <span>output</span>
      <button id="clearBtn">clear</button>
    </div>
    <div id="output"><span class="hint">loading MyLang… (~370KB)</span></div>
  </div>
</main>

<script src="mylang.js"></script>
<script>
const EXAMPLES = {
hello: `# Welcome to MyLang! / MyLang에 온 걸 환영해요
let 이름 = "world"
print "Hello, {이름}!"          # 문자열 보간 / string interpolation

for i = 1 to 5 {
    if i % 2 == 1 then { print i, "is odd / 홀수" }
    else { print i, "is even / 짝수" }
}`,

fib: `# Recursion — identifiers can be in any language
func fib(n) {
    if n <= 2 then { return 1 }
    return fib(n - 1) + fib(n - 2)
}

for i = 1 to 15 {
    print "fib(" + i + ") =", fib(i)
}`,

class: `# Classes with constructors, methods, and self
class 사람 {
    func init(이름, 나이) {
        self.이름 = 이름
        self.나이 = 나이
    }
    func 인사() { print "안녕! 나는 " + self.이름 + " (" + self.나이 + "살)" }
    func 생일() {
        self.나이 += 1
        print self.이름 + " 생일 축하! 이제 " + self.나이 + "살"
    }
}

let p = 사람("성윤", 15)
p.인사()
p.생일()
print p`,

dict: `# Dictionaries + error handling
let 성적 = {"수학": 92, "영어": 85}
성적["과학"] = 88          # new keys are created on assignment
성적["수학"] += 3

for 과목 in 성적 {
    print 과목, "→", 성적[과목]
}

try {
    print 성적["체육"]      # missing key → error
} catch 오류 {
    print "잡았다:", 오류
}
print "keys:", keys(성적), "/ len:", len(성적)`,

guess: `# Number guessing game — input pops up a dialog
let 정답 = random(1, 100)
let 시도 = 0
print "1~100 사이 숫자를 맞혀보세요!"

while true {
    let 답 = input "숫자 입력: "
    시도 += 1
    if 답 == 정답 {
        print "정답!", 시도, "번 만에 맞혔어요 🎉"
        break
    } else if 답 < 정답 { print "더 커요 ↑" }
    else { print "더 작아요 ↓" }
}`,

rpg: `# ================================================
#  던전 오브 마이랭 — MyLang 텍스트 RPG
# ================================================

class 플레이어 {
    func init(이름) {
        self.이름 = 이름
        self.레벨 = 1
        self.exp = 0
        self.최대hp = 50
        self.hp = 50
        self.atk = 8
        self.골드 = 30
        self.물약 = 2
    }
    func 상태() {
        print ""
        print "===== " + self.이름 + " (Lv." + self.레벨 + ") ====="
        print "HP: " + self.hp + "/" + self.최대hp + "   공격력: " + self.atk
        print "골드: " + self.골드 + "   물약: " + self.물약 + "개   EXP: " + self.exp + "/" + (self.레벨 * 20)
    }
    func 공격굴림() {
        # 공격력의 80% ~ 120% 사이 무작위
        return random(round(self.atk * 0.8), round(self.atk * 1.2))
    }
    func 물약마시기() {
        if self.물약 <= 0 {
            print ">> 물약이 없다!"
            return false
        }
        self.물약 -= 1
        let 회복량 = 30
        self.hp = min(self.hp + 회복량, self.최대hp)
        print ">> 물약을 마셨다! HP " + 회복량 + " 회복 → " + self.hp + "/" + self.최대hp
        return true
    }
    func 경험치획득(량) {
        self.exp += 량
        while self.exp >= self.레벨 * 20 {
            self.exp -= self.레벨 * 20
            self.레벨 += 1
            self.최대hp += 15
            self.atk += 3
            self.hp = self.최대hp
            print ""
            print "★★ 레벨 업! Lv." + self.레벨 + " (HP/공격력 상승, 체력 전부 회복) ★★"
        }
    }
    func 저장하기() {
        let 데이터 = self.이름 + "," + self.레벨 + "," + self.exp + "," + self.최대hp
        데이터 = 데이터 + "," + self.hp + "," + self.atk + "," + self.골드 + "," + self.물약
        writefile("save.txt", 데이터)
        print ">> 저장 완료! (save.txt)"
    }
}

class 몬스터 {
    func init(틀, 강화) {
        self.이름 = 틀["이름"]
        self.hp = 틀["hp"] + 강화 * 8
        self.atk = 틀["atk"] + 강화 * 2
        self.골드 = 틀["골드"] + 강화 * 5
        self.exp = 틀["exp"] + 강화 * 4
    }
    func 공격굴림() {
        return random(round(self.atk * 0.7), round(self.atk * 1.3))
    }
}

func 몬스터소환(레벨) {
    let 도감 = [
        {"이름": "끈적 슬라임", "hp": 22, "atk": 4, "골드": 8,  "exp": 7},
        {"이름": "동굴 고블린", "hp": 32, "atk": 6, "골드": 14, "exp": 12},
        {"이름": "잿빛 늑대",   "hp": 42, "atk": 9, "골드": 22, "exp": 18},
        {"이름": "광산 오크",   "hp": 55, "atk": 12, "골드": 34, "exp": 26}
    ]
    let 강화 = 레벨 - 1
    let 번호 = random(1, min(len(도감), 레벨 + 1))
    return 몬스터(도감[번호], 강화)
}

# 전투: 승리 true / 도망·사망 false
func 전투(p, m) {
    print ""
    print "!!! " + m.이름 + " 이(가) 나타났다! (HP " + m.hp + " / 공격력 " + m.atk + ")"
    while true {
        print ""
        print "[1] 공격  [2] 물약(" + p.물약 + "개)  [3] 도망"
        let 선택 = input "> "
        if 선택 == 1 {
            let 피해 = p.공격굴림()
            m.hp -= 피해
            print ">> " + m.이름 + " 에게 " + 피해 + " 피해! (남은 HP " + max(m.hp, 0) + ")"
            if m.hp <= 0 {
                print ""
                print ">> " + m.이름 + " 을(를) 쓰러뜨렸다! +" + m.골드 + "골드 +" + m.exp + "exp"
                p.골드 += m.골드
                p.경험치획득(m.exp)
                return true
            }
        } else if 선택 == 2 {
            if not p.물약마시기() { continue }   # 물약 없으면 턴 유지
        } else if 선택 == 3 {
            if random(1, 100) <= 50 {
                print ">> 무사히 도망쳤다!"
                return false
            }
            print ">> 도망 실패!"
        } else {
            print ">> 1, 2, 3 중에 골라줘"
            continue
        }
        # 몬스터의 반격
        let 반격 = m.공격굴림()
        p.hp -= 반격
        print ">> " + m.이름 + " 의 공격! " + 반격 + " 피해 (내 HP " + max(p.hp, 0) + "/" + p.최대hp + ")"
        if p.hp <= 0 { return false }
    }
}

func 상점(p) {
    while true {
        print ""
        print "===== 상점 ===== (보유 골드: " + p.골드 + ")"
        print "[1] 물약 (20골드)  [2] 공격력 +2 (40골드)  [3] 나가기"
        let 선택 = input "> "
        if 선택 == 1 {
            if p.골드 < 20 { print ">> 골드 부족!" continue }
            p.골드 -= 20
            p.물약 += 1
            print ">> 물약 구매! (보유 " + p.물약 + "개)"
        } else if 선택 == 2 {
            if p.골드 < 40 { print ">> 골드 부족!" continue }
            p.골드 -= 40
            p.atk += 2
            print ">> 공격력이 " + p.atk + " 이 되었다!"
        } else if 선택 == 3 {
            return 0
        } else {
            print ">> 1, 2, 3 중에 골라줘"
        }
    }
}

func 불러오기() {
    let f = split(readfile("save.txt"), ",")
    let p = 플레이어(f[1])
    p.레벨 = num(f[2])
    p.exp = num(f[3])
    p.최대hp = num(f[4])
    p.hp = num(f[5])
    p.atk = num(f[6])
    p.골드 = num(f[7])
    p.물약 = num(f[8])
    print ">> 불러오기 완료: " + p.이름 + " (Lv." + p.레벨 + ")"
    return p
}

# ================= 게임 시작 =================
print "================================"
print "   던전 오브 마이랭 (MyLang RPG)"
print "================================"
print "[1] 새 게임  [2] 불러오기"
let 시작 = input "> "
let p = 0
if 시작 == 2 and not exists("save.txt") {
    print ">> 세이브 파일이 없다! 새 게임으로 시작할게."
    시작 = 1
}
if 시작 == 2 {
    p = 불러오기()
} else {
    let 이름 = input "용사의 이름은? > "
    p = 플레이어(이름)
    print ""
    print 이름 + " 용사, 던전에 온 것을 환영한다!"
    print "Lv.4 가 되면 던전의 주인 '흑염 드래곤' 에게 도전할 수 있다."
}

let 게임중 = true
while 게임중 {
    print ""
    print "========== 마을 =========="
    print "[1] 던전 탐험  [2] 상태 보기  [3] 상점  [4] 저장  [5] 종료"
    if p.레벨 >= 4 { print "[6] ★ 보스에게 도전한다 ★" }
    let 선택 = input "> "

    if 선택 == 1 {
        let m = 몬스터소환(p.레벨)
        전투(p, m)
        if p.hp <= 0 {
            print ""
            print "▼▼ " + p.이름 + " 은(는) 쓰러졌다... GAME OVER ▼▼"
            게임중 = false
        }
    } else if 선택 == 2 {
        p.상태()
    } else if 선택 == 3 {
        상점(p)
    } else if 선택 == 4 {
        p.저장하기()
    } else if 선택 == 5 {
        print ""
        print "또 만나자, " + p.이름 + "!"
        게임중 = false
    } else if 선택 == 6 and p.레벨 >= 4 {
        let 보스틀 = {"이름": "흑염 드래곤", "hp": 130, "atk": 16, "골드": 300, "exp": 100}
        let 보스 = 몬스터(보스틀, 0)
        if 전투(p, 보스) {
            print ""
            print "★★★★★★★★★★★★★★★★★★★★"
            print " 드래곤을 쓰러뜨렸다! 던전 클리어!"
            print " 최종: Lv." + p.레벨 + " / 골드 " + p.골드
            print "★★★★★★★★★★★★★★★★★★★★"
            게임중 = false
        } else if p.hp <= 0 {
            print ""
            print "▼▼ 드래곤 앞에 쓰러졌다... GAME OVER ▼▼"
            게임중 = false
        }
    } else {
        print ">> 메뉴 번호를 골라줘"
    }
}
print ""
print "(게임 종료)"
`
};

const editor = document.getElementById('editor');
const output = document.getElementById('output');
const runBtn = document.getElementById('runBtn');
const examples = document.getElementById('examples');

editor.value = EXAMPLES.hello;
examples.onchange = () => { editor.value = EXAMPLES[examples.value]; };
document.getElementById('clearBtn').onclick = () => { output.textContent = ''; };

// Tab 키로 4칸 들여쓰기
editor.addEventListener('keydown', e => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const s = editor.selectionStart;
    editor.setRangeText('    ', s, editor.selectionEnd, 'end');
  }
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); run(); }
});

function append(text, cls) {
  const span = document.createElement('span');
  if (cls) span.className = cls;
  span.textContent = text + '\n';
  output.appendChild(span);
  output.scrollTop = output.scrollHeight;
}

let M = null;
createMyLang({
  print: t => append(t, t.startsWith('!!') ? 'err' : (t.startsWith('===') ? 'ok' : '')),
  printErr: t => append(t, 'err'),
}).then(mod => {
  M = mod;
  output.textContent = '';
  append('MyLang ready. Press ▶ Run! / 준비 완료', 'ok');
  runBtn.disabled = false;
});

function run() {
  if (!M || runBtn.disabled) return;
  runBtn.disabled = true;
  output.textContent = '';
  // 렌더링 한 프레임 양보 후 동기 실행 (실행 중엔 탭이 잠시 멈출 수 있음)
  setTimeout(() => {
    try {
      M.ccall('mylang_run', null, ['string'], [editor.value]);
    } catch (e) {
      append('!! runtime error: ' + e, 'err');
    }
    runBtn.disabled = false;
  }, 30);
}
runBtn.onclick = run;
</script>
</body>
</html>
