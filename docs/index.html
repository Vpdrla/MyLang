<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Venos Playground — try it in your browser</title>
<meta name="description" content="Venos: a pseudocode-style programming language. Run it right here in your browser (WebAssembly).">
<meta property="og:type" content="website">
<meta property="og:title" content="Venos Playground — try it in your browser">
<meta property="og:description" content="A pseudocode-style programming language with a dual backend (interpreter + C++ transpiler). Runs entirely in your browser via WebAssembly — no install needed.">
<meta property="og:url" content="https://vpdrla.github.io/Venos/">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Venos Playground — try it in your browser">
<meta name="twitter:description" content="A pseudocode-style programming language. Runs entirely in your browser via WebAssembly — no install needed.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>▶</text></svg>">
<style>
  :root {
    --bg: #16181d; --panel: #1e2128; --panel2: #22262e;
    --text: #d7dae0; --dim: #8b919c; --accent: #4ea1ff; --accent2: #7ee787;
    --err: #ff7b72; --border: #2c313a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 12px 18px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  header h1 { font-size: 18px; color: var(--accent); font-weight: 700; }
  header .sub { color: var(--dim); font-size: 13px; }
  header a { color: var(--dim); font-size: 13px; text-decoration: none; margin-left: auto; }
  header a:hover { color: var(--accent); }
  .toolbar {
    padding: 10px 18px; display: flex; gap: 10px; align-items: center;
    border-bottom: 1px solid var(--border); flex-wrap: wrap;
  }
  button, select {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    padding: 7px 16px; border-radius: 7px; font-size: 14px; cursor: pointer;
  }
  #runBtn { background: var(--accent); color: #0b0d10; font-weight: 700; padding: 7px 26px; }
  #runBtn:disabled { opacity: .5; cursor: wait; }
  button:hover:not(:disabled), select:hover { border-color: var(--accent); }
  .hint { color: var(--dim); font-size: 12px; }
  main { flex: 1; display: flex; min-height: 0; }
  .pane { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .pane + .pane { border-left: 1px solid var(--border); }
  .pane-title {
    padding: 6px 14px; font-size: 12px; color: var(--dim);
    background: var(--panel); border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
  }
  #editor {
    flex: 1; background: var(--bg); color: var(--text); border: none; resize: none;
    padding: 14px; font-family: "Cascadia Code", Consolas, "D2Coding", monospace;
    font-size: 14px; line-height: 1.55; outline: none; white-space: pre; overflow: auto;
    tab-size: 4;
  }
  #output {
    flex: 1; padding: 14px; overflow: auto; white-space: pre-wrap;
    font-family: "Cascadia Code", Consolas, "D2Coding", monospace;
    font-size: 14px; line-height: 1.55; background: var(--panel);
  }
  #output .err { color: var(--err); }
  #output .ok { color: var(--accent2); }
  #clearBtn { font-size: 11px; padding: 2px 10px; }
  @media (max-width: 760px) {
    main { flex-direction: column; }
    .pane + .pane { border-left: none; border-top: 1px solid var(--border); }
  }
</style>
</head>
<body>

<header>
  <h1>Venos Playground</h1>
  <span class="sub">runs entirely in your browser (WebAssembly) — no install</span>
  <a href="https://github.com/Vpdrla/Venos" target="_blank">GitHub ↗</a>
</header>

<div class="toolbar">
  <button id="runBtn" disabled>▶ Run (Ctrl+Enter)</button>
  <select id="examples">
    <option value="hello">Hello / basics</option>
    <option value="fib">Recursion (fib)</option>
    <option value="class">Classes (Korean identifiers)</option>
    <option value="dict">Dict + try/catch</option>
    <option value="guess">Game: number guessing (input)</option>
    <option value="rpg">Game: Dungeon of Venos (RPG)</option>
  </select>
  <span class="hint">input uses a dialog · import is not available on the web · writefile is in-memory only (resets on reload)</span>
</div>

<main>
  <div class="pane">
    <div class="pane-title"><span>code (.my)</span></div>
    <textarea id="editor" spellcheck="false"></textarea>
  </div>
  <div class="pane">
    <div class="pane-title">
      <span>output</span>
      <button id="clearBtn">clear</button>
    </div>
    <div id="output"><span class="hint">loading Venos… (~370KB)</span></div>
  </div>
</main>

<script src="venos.js"></script>
<script>
const EXAMPLES = {
hello: `# Welcome to Venos!
let name = "world"
print "Hello, {name}!"          # string interpolation

for i = 1 to 5 {
    if i % 2 == 1 then { print i, "is odd" }
    else { print i, "is even" }
}`,

fib: `# Recursion — identifiers can be in any language
func fib(n) {
    if n <= 2 then { return 1 }
    return fib(n - 1) + fib(n - 2)
}

for i = 1 to 15 {
    print "fib(" + i + ") =", fib(i)
}`,

class: `# Classes — and identifiers can be written in any language
class 사람 {
    func init(이름, 나이) {
        self.이름 = 이름
        self.나이 = 나이
    }
    func 인사() { print "안녕! 나는 " + self.이름 + " (" + self.나이 + "살)" }
    func 생일() {
        self.나이 += 1
        print self.이름 + " 생일 축하! 이제 " + self.나이 + "살"
    }
}

let p = 사람("미르", 15)
p.인사()
p.생일()
print p`,

dict: `# Dictionaries + error handling
let scores = {"math": 92, "english": 85}
scores["science"] = 88          # new keys are created on assignment
scores["math"] += 3

for subject in scores {
    print subject, "->", scores[subject]
}

try {
    print scores["gym"]         # missing key -> error
} catch err {
    print "caught:", err
}
print "keys:", keys(scores), "/ len:", len(scores)`,

guess: `# Number guessing game — input pops up a dialog
let answer = random(1, 100)
let tries = 0
print "Guess a number between 1 and 100!"

while true {
    let guess = input "Your guess: "
    tries += 1
    if guess == answer {
        print "Correct! You got it in", tries, "tries 🎉"
        break
    } else if guess < answer { print "Higher! ↑" }
    else { print "Lower! ↓" }
}`,

rpg: `# ================================================
#  Dungeon of Venos — a text RPG in Venos (English)
#  (examples/rpg.my is the same game with Korean identifiers)
# ================================================

class Player {
    func init(name) {
        self.name = name
        self.level = 1
        self.exp = 0
        self.maxhp = 50
        self.hp = 50
        self.atk = 8
        self.gold = 30
        self.potions = 2
    }
    func stats() {
        print ""
        print "===== {self.name} (Lv.{self.level}) ====="
        print "HP: {self.hp}/{self.maxhp}   ATK: {self.atk}"
        print "Gold: {self.gold}   Potions: {self.potions}   EXP: {self.exp}/{self.level * 20}"
    }
    func attack_roll() {
        # random between 80% and 120% of ATK
        return random(round(self.atk * 0.8), round(self.atk * 1.2))
    }
    func drink_potion() {
        if self.potions <= 0 {
            print ">> No potions left!"
            return false
        }
        self.potions -= 1
        let heal = 30
        self.hp = min(self.hp + heal, self.maxhp)
        print ">> You drink a potion! +{heal} HP → {self.hp}/{self.maxhp}"
        return true
    }
    func gain_exp(amount) {
        self.exp += amount
        while self.exp >= self.level * 20 {
            self.exp -= self.level * 20
            self.level += 1
            self.maxhp += 15
            self.atk += 3
            self.hp = self.maxhp
            print ""
            print "** LEVEL UP! Lv.{self.level} (HP/ATK up, fully healed) **"
        }
    }
    func save_game() {
        let data = self.name + "," + self.level + "," + self.exp + "," + self.maxhp
        data = data + "," + self.hp + "," + self.atk + "," + self.gold + "," + self.potions
        writefile("save.txt", data)
        print ">> Saved! (save.txt)"
    }
}

class Monster {
    func init(template, boost) {
        self.name = template["name"]
        self.hp = template["hp"] + boost * 8
        self.atk = template["atk"] + boost * 2
        self.gold = template["gold"] + boost * 5
        self.exp = template["exp"] + boost * 4
    }
    func attack_roll() {
        return random(round(self.atk * 0.7), round(self.atk * 1.3))
    }
}

func spawn_monster(level) {
    let bestiary = [
        {"name": "Sticky Slime", "hp": 22, "atk": 4,  "gold": 8,  "exp": 7},
        {"name": "Cave Goblin",  "hp": 32, "atk": 6,  "gold": 14, "exp": 12},
        {"name": "Ash Wolf",     "hp": 42, "atk": 9,  "gold": 22, "exp": 18},
        {"name": "Mine Orc",     "hp": 55, "atk": 12, "gold": 34, "exp": 26}
    ]
    let boost = level - 1
    let pick = random(1, min(len(bestiary), level + 1))
    return Monster(bestiary[pick], boost)
}

# battle: returns true on victory, false on flee/death
func battle(p, m) {
    print ""
    print "!!! A wild {m.name} appears! (HP {m.hp} / ATK {m.atk})"
    while true {
        print ""
        print "[1] Attack  [2] Potion ({p.potions} left)  [3] Run"
        let choice = input "> "
        if choice == 1 {
            let dmg = p.attack_roll()
            m.hp -= dmg
            print ">> You hit the {m.name} for {dmg}! (HP left: {max(m.hp, 0)})"
            if m.hp <= 0 {
                print ""
                print ">> The {m.name} is defeated! +{m.gold} gold, +{m.exp} exp"
                p.gold += m.gold
                p.gain_exp(m.exp)
                return true
            }
        } else if choice == 2 {
            if not p.drink_potion() { continue }   # no potion → keep your turn
        } else if choice == 3 {
            if random(1, 100) <= 50 {
                print ">> You got away safely!"
                return false
            }
            print ">> Couldn't escape!"
        } else {
            print ">> Pick 1, 2 or 3"
            continue
        }
        # the monster strikes back
        let hit = m.attack_roll()
        p.hp -= hit
        print ">> The {m.name} hits you for {hit}! (Your HP: {max(p.hp, 0)}/{p.maxhp})"
        if p.hp <= 0 { return false }
    }
}

func shop(p) {
    while true {
        print ""
        print "===== Shop ===== (your gold: {p.gold})"
        print "[1] Potion (20g)  [2] ATK +2 (40g)  [3] Leave"
        let choice = input "> "
        if choice == 1 {
            if p.gold < 20 { print ">> Not enough gold!" continue }
            p.gold -= 20
            p.potions += 1
            print ">> Bought a potion! (you have {p.potions})"
        } else if choice == 2 {
            if p.gold < 40 { print ">> Not enough gold!" continue }
            p.gold -= 40
            p.atk += 2
            print ">> Your ATK is now {p.atk}!"
        } else if choice == 3 {
            return 0
        } else {
            print ">> Pick 1, 2 or 3"
        }
    }
}

func load_game() {
    let f = split(readfile("save.txt"), ",")
    let p = Player(f[1])
    p.level = num(f[2])
    p.exp = num(f[3])
    p.maxhp = num(f[4])
    p.hp = num(f[5])
    p.atk = num(f[6])
    p.gold = num(f[7])
    p.potions = num(f[8])
    print ">> Loaded: {p.name} (Lv.{p.level})"
    return p
}

# ================= the game starts =================
print "================================"
print "   Dungeon of Venos  (text RPG)"
print "================================"
print "[1] New game  [2] Load"
let start = input "> "
let p = 0
if start == 2 and not exists("save.txt") {
    print ">> No save file found — starting a new game."
    start = 1
}
if start == 2 {
    p = load_game()
} else {
    let name = input "What is your hero's name? > "
    p = Player(name)
    print ""
    print "Welcome to the dungeon, {name}!"
    print "Reach Lv.4 to challenge its master, the Black Flame Dragon."
}

let playing = true
while playing {
    print ""
    print "========== Village =========="
    print "[1] Explore  [2] Stats  [3] Shop  [4] Save  [5] Quit"
    if p.level >= 4 { print "[6] * Challenge the boss *" }
    let choice = input "> "

    if choice == 1 {
        let m = spawn_monster(p.level)
        battle(p, m)
        if p.hp <= 0 {
            print ""
            print "vv {p.name} has fallen... GAME OVER vv"
            playing = false
        }
    } else if choice == 2 {
        p.stats()
    } else if choice == 3 {
        shop(p)
    } else if choice == 4 {
        p.save_game()
    } else if choice == 5 {
        print ""
        print "See you next time, {p.name}!"
        playing = false
    } else if choice == 6 and p.level >= 4 {
        let boss_template = {"name": "Black Flame Dragon", "hp": 130, "atk": 16, "gold": 300, "exp": 100}
        let boss = Monster(boss_template, 0)
        if battle(p, boss) {
            print ""
            print "********************************"
            print " The dragon falls! DUNGEON CLEAR!"
            print " Final: Lv.{p.level} / {p.gold} gold"
            print "********************************"
            playing = false
        } else if p.hp <= 0 {
            print ""
            print "vv You fell before the dragon... GAME OVER vv"
            playing = false
        }
    } else {
        print ">> Pick a menu number"
    }
}
print ""
print "(The adventure ends here)"`
};

const editor = document.getElementById('editor');
const output = document.getElementById('output');
const runBtn = document.getElementById('runBtn');
const examples = document.getElementById('examples');

editor.value = EXAMPLES.hello;
examples.onchange = () => { editor.value = EXAMPLES[examples.value]; };
document.getElementById('clearBtn').onclick = () => { output.textContent = ''; };

// Tab 키로 4칸 들여쓰기
editor.addEventListener('keydown', e => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const s = editor.selectionStart;
    editor.setRangeText('    ', s, editor.selectionEnd, 'end');
  }
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); run(); }
});

function append(text, cls) {
  const span = document.createElement('span');
  if (cls) span.className = cls;
  span.textContent = text + '\n';
  output.appendChild(span);
  output.scrollTop = output.scrollHeight;
}

let M = null;
createVenos({
  print: t => append(t, t.startsWith('!!') ? 'err' : (t.startsWith('===') ? 'ok' : '')),
  printErr: t => append(t, 'err'),
}).then(mod => {
  M = mod;
  output.textContent = '';
  append('Venos ready. Press \u25b6 Run!', 'ok');
  runBtn.disabled = false;
});

function run() {
  if (!M || runBtn.disabled) return;
  runBtn.disabled = true;
  output.textContent = '';
  // 렌더링 한 프레임 양보 후 동기 실행 (실행 중엔 탭이 잠시 멈출 수 있음)
  setTimeout(() => {
    try {
      M.ccall('venos_run', null, ['string'], [editor.value]);
    } catch (e) {
      append('!! runtime error: ' + e, 'err');
    }
    runBtn.disabled = false;
  }, 30);
}
runBtn.onclick = run;
</script>
</body>
</html>
