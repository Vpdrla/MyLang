name: Release

# 태그를 밀면 세 플랫폼 바이너리를 빌드해 GitHub Releases 에 올린다.
#   git tag v0.6.0 && git push origin v0.6.0
# workflow_dispatch 로도 돌릴 수 있다 — tag 를 비워두면 빌드·테스트만 하고 릴리스는 만들지
# 않는다. tag 를 채우면 그 이름으로 태그를 만들고 릴리스까지 낸다 (터미널 없이 릴리스할 때).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '릴리스로 만들 태그 (예: v0.6.0). 비우면 빌드만 하고 릴리스는 안 만든다.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # Linux 와 Windows 는 한 러너에서 만든다. Windows 는 MinGW 크로스 컴파일 —
  # venos.cpp 의 windows.h/_beginthreadex/_getch 경로가 그대로 컴파일되는 것을 확인했다.
  linux-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 메타패키지 g++-mingw-w64-x86-64 는 posix/win32 스레딩 변종을 둘 다 끌어와 144MB 를 받는다.
      # venos.cpp 는 Windows 에서 _beginthreadex(Win32 API)만 쓰고 std::thread 는 안 쓰므로
      # 변종은 아무거나 되고, posix 하나만 받으면 절반이면 된다.
      # (Azure 미러가 32kB/s 로 죽어 이 단계가 75분 걸린 적이 있어 재시도도 켜 둔다.)
      - name: Install MinGW cross-compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            -o Acquire::Retries=3 g++-mingw-w64-x86-64-posix

      - name: Build Linux (static)
        run: |
          g++ -std=c++17 -O2 -Wall -Werror -static -o venos venos.cpp
          file venos

      # 릴리스로 나가는 바로 그 바이너리로 전체 differential 스위트를 돌린다
      - name: Test the Linux binary
        run: tests/run_tests.sh

      - name: Build Windows (MinGW, static)
        run: |
          x86_64-w64-mingw32-g++-posix -std=c++17 -O2 -Wall -Werror -static -o venos.exe venos.cpp
          file venos.exe

      - name: Stage artifacts
        run: |
          mkdir -p out
          cp venos     out/venos-linux-x64
          cp venos.exe out/venos-windows-x64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: venos-linux-windows
          path: out/*
          if-no-files-found: error

  # macOS 는 크로스 컴파일이 어려워 전용 러너에서. 인텔·애플실리콘 둘 다 도는 유니버설 바이너리로 만든다.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build macOS (universal, arm64 + x86_64)
        run: |
          clang++ -std=c++17 -O2 -Wall -Werror -arch arm64 -arch x86_64 -o venos venos.cpp
          file venos

      - name: Test the macOS binary
        run: tests/run_tests.sh

      - name: Stage artifact
        run: |
          mkdir -p out
          cp venos out/venos-macos-universal

      - uses: actions/upload-artifact@v4
        with:
          name: venos-macos
          path: out/*
          if-no-files-found: error

  release:
    needs: [linux-windows, macos]
    runs-on: ubuntu-latest
    # 태그를 밀었을 때, 또는 수동 실행에서 tag 를 채웠을 때만 릴리스를 만든다.
    # tag 를 비운 수동 실행은 빌드·테스트만 하고 여기서 멈춘다.
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl

      - name: Collect binaries and checksums
        run: |
          mkdir -p out
          find dl -type f -exec cp {} out/ \;
          chmod +x out/venos-linux-x64 out/venos-macos-universal
          cd out && sha256sum * > SHA256SUMS.txt
          ls -lh

      - uses: softprops/action-gh-release@v2
        with:
          # 태그 push 면 그 태그, 수동 실행이면 입력한 이름 (없는 태그는 이 커밋에 새로 만든다)
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: out/*
          generate_release_notes: true
          body: |
            ## Install

            Download the file for your machine, then run it — there is nothing else to install.

            | Your machine | File |
            |---|---|
            | Windows | `venos-windows-x64.exe` |
            | macOS (Intel or Apple Silicon) | `venos-macos-universal` |
            | Linux | `venos-linux-x64` |

            **Windows** — double-click the `.exe`, or run `venos-windows-x64.exe program.my` in a terminal.

            **macOS / Linux** — make it executable first:

            ```bash
            chmod +x venos-macos-universal        # or venos-linux-x64
            ./venos-macos-universal               # interactive shell
            ./venos-macos-universal program.my    # run a file
            ```

            On macOS the first launch may be blocked because the binary is not
            notarized — right-click the file and choose **Open**, or run
            `xattr -d com.apple.quarantine venos-macos-universal`.

            ### Notes

            - These binaries are statically linked, so they carry no runtime dependencies.
            - The interpreter works on its own. The `build` command (transpile to C++ and
              compile to a native executable) additionally needs `g++` on your machine.
            - Prefer nothing to install at all? Everything also runs in the browser:
              **https://vpdrla.github.io/Venos/**
            - New to the language? Start with the [tutorial](https://github.com/Vpdrla/Venos/blob/main/TUTORIAL.md)
              ([한국어](https://github.com/Vpdrla/Venos/blob/main/TUTORIAL.ko.md)).

            `SHA256SUMS.txt` lists the checksums of every file in this release.
